<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Craft da Kali - Catálogo</title>
    <style>
        :root {
            --primary-color: #ff9a9e;
            --secondary-color: #fecfef;
            --text-color: #333;
            --bg-color: #fffafb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            padding: 2rem;
            text-align: center;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            gap: 2rem;
        }

        .products-grid {
            flex: 2;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .product-card {
            background: white;
            border-radius: 15px;
            padding: 1.5rem;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-image {
            width: 100%;
            height: 200px;
            background-color: #f5f5f5;
            border-radius: 10px;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aaa;
            font-size: 0.9rem;
        }

        .product-title {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            color: #444;
        }

        .product-price {
            font-weight: bold;
            color: var(--primary-color);
            font-size: 1.3rem;
            margin-bottom: 1rem;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: background-color 0.3s;
            width: 100%;
        }

        button:hover {
            background-color: #ff7a80;
        }

        .cart-section {
            flex: 1;
            background: white;
            padding: 1.5rem;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            min-width: 300px;
            height: fit-content;
            position: sticky;
            top: 2rem;
        }

        .cart-section h2 {
            margin-bottom: 1rem;
            color: var(--primary-color);
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 0.5rem;
        }

        .cart-items {
            list-style: none;
            margin-bottom: 1rem;
            max-height: 300px;
            overflow-y: auto;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
            font-size: 0.95rem;
        }

        .remove-btn {
            background-color: #ff4d4d;
            padding: 2px 8px;
            width: auto;
            font-size: 0.8rem;
        }

        .cart-total {
            font-size: 1.2rem;
            font-weight: bold;
            text-align: right;
            margin-bottom: 1rem;
            border-top: 2px solid var(--secondary-color);
            padding-top: 0.5rem;
        }

        .whatsapp-btn {
            background-color: #25D366;
        }

        .whatsapp-btn:hover {
            background-color: #128C7E;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .cart-section {
                position: static;
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Craft da Kali</h1>
        <p>Mimos e artesanatos feitos com amor</p>
    </header>

    <div class="container">
        <div class="products-grid" id="products-grid">
            <!-- Os produtos serão injetados aqui pelo JavaScript -->
        </div>

        <div class="cart-section">
            <h2>Seu Pedido</h2>
            <ul class="cart-items" id="cart-items">
                <!-- Itens do carrinho aparecerão aqui -->
            </ul>
            <div class="cart-total">
                Total: R$ <span id="total-price">0.00</span>
            </div>
            <button class="whatsapp-btn" onclick="finalizarPedido()">Finalizar no WhatsApp 📱</button>
        </div>
    </div>

    <script>
        // Substitua pelo seu número de WhatsApp real (com DDD, sem espaços ou traços)
        const SEU_WHATSAPP = "5584921648956"; 

        // Catálogo de Produtos
        const produtos = [
            { id: 1, nome: "Botton Personalizado 3.7cm", preco: 3.50 },
            { id: 2, nome: "Botton Holográfico 58mm", preco: 5.00 },
            { id: 3, nome: "Botton Transparente 58mm", preco: 4.50 },
            { id: 4, nome: "Arte em Hama Beads", preco: 12.00 },
            { id: 5, nome: "Chaveiro Personalizado", preco: 8.00 },
            { id: 6, nome: "Kit Laços (Par)", preco: 15.00 }
        ];

        let carrinho = [];

        // Função para exibir os produtos na tela
        function renderizarProdutos() {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';
            
            produtos.forEach(produto => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-image">[Foto do Produto]</div>
                    <h3 class="product-title">${produto.nome}</h3>
                    <p class="product-price">R$ ${produto.preco.toFixed(2).replace('.', ',')}</p>
                    <button onclick="adicionarAoCarrinho(${produto.id})">Adicionar</button>
                `;
                grid.appendChild(card);
            });
        }

        // Função para adicionar ao carrinho
        function adicionarAoCarrinho(idProduto) {
            const produto = produtos.find(p => p.id === idProduto);
            
            const itemNoCarrinho = carrinho.find(item => item.id === idProduto);
            if (itemNoCarrinho) {
                itemNoCarrinho.quantidade += 1;
            } else {
                carrinho.push({ ...produto, quantidade: 1 });
            }
            
            atualizarCarrinho();
        }

        // Função para remover do carrinho
        function removerDoCarrinho(idProduto) {
            carrinho = carrinho.filter(item => item.id !== idProduto);
            atualizarCarrinho();
        }

        // Função para atualizar a visualização do carrinho
        function atualizarCarrinho() {
            const lista = document.getElementById('cart-items');
            const totalSpan = document.getElementById('total-price');
            
            lista.innerHTML = '';
            let total = 0;

            if (carrinho.length === 0) {
                lista.innerHTML = '<li>Seu carrinho está vazio</li>';
            } else {
                carrinho.forEach(item => {
                    const subtotal = item.preco * item.quantidade;
                    total += subtotal;
                    
                    const li = document.createElement('li');
                    li.className = 'cart-item';
                    li.innerHTML = `
                        <span>${item.quantidade}x ${item.nome}</span>
                        <div>
                            <span>R$ ${subtotal.toFixed(2).replace('.', ',')}</span>
                            <button class="remove-btn" onclick="removerDoCarrinho(${item.id})">X</button>
                        </div>
                    `;
                    lista.appendChild(li);
                });
            }

            totalSpan.textContent = total.toFixed(2).replace('.', ',');
        }

        // Função para gerar o link e enviar para o WhatsApp
        function finalizarPedido() {
            if (carrinho.length === 0) {
                alert("Adicione alguns produtos ao carrinho primeiro!");
                return;
            }

            let mensagem = "Olá! Gostaria de fazer o seguinte pedido na Craft da Kali:%0A%0A";
            let total = 0;

            carrinho.forEach(item => {
                const subtotal = item.preco * item.quantidade;
                total += subtotal;
                mensagem += `${item.quantidade}x ${item.nome} - R$ ${subtotal.toFixed(2).replace('.', ',')}%0A`;
            });

            mensagem += `%0A*Total: R$ ${total.toFixed(2).replace('.', ',')}*%0A%0AGostaria de realizar o pagamento via Pix.`;

            const linkWhatsapp = `https://wa.me/${SEU_WHATSAPP}?text=${mensagem}`;
            window.open(linkWhatsapp, '_blank');
        }

        // Iniciar a página
        renderizarProdutos();
        atualizarCarrinho();
    </script>
</body>
</html>
